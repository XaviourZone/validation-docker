services:
  parser:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: validation/parser:dev
    restart: unless-stopped
    command: ["python", "-m", "Validation.Data_Parser.app.main", "--config", "/opt/validation/docker/parser.yaml"]
    volumes:
      - ./docker:/opt/validation/docker
      - ./runtime/data_inflow:/opt/validation/DATA_INFLOW
      - ./runtime/spool:/opt/validation/Validation/Data_Forwarder/spool
      - ./runtime/parser-logs:/opt/validation/Validation/Data_Parser/logs
      - ./runtime/parser-state:/opt/validation/Validation/state
      - ./runtime/reference:/opt/validation/runtime/reference
    ports:
      - "10001:10001"
      - "10002:10002"
      - "10003:10003"
      - "10004:10004"
      - "10005:10005"
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 5

  router:
    image: validation/parser:dev
    restart: unless-stopped
    command: ["python", "-m", "Validation.Data_Router.app.main", "--config", "/opt/validation/docker/sources.yaml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      parser:
        condition: service_healthy
    volumes:
      - ./docker:/opt/validation/docker
      - ./runtime/data_inflow:/opt/validation/DATA_INFLOW
      - ./runtime/router-state:/opt/validation/Validation/Data_Router/state
      - ./runtime/router-logs:/opt/validation/Validation/Data_Router/logs
    ports:
      - "8080:8080"

  forwarder:
    image: validation/parser:dev
    restart: unless-stopped
    command: ["python", "-m", "Validation.Data_Forwarder.app.main", "--config", "/opt/validation/docker/forwarder.yaml"]
    volumes:
      - ./docker:/opt/validation/docker
      - ./runtime/spool:/opt/validation/Validation/Data_Forwarder/spool
      - ./runtime/forwarder-state:/opt/validation/Validation/Data_Forwarder/state
    ports:
      - "8082:8082"

  pans-importer:
    image: validation/parser:dev
    restart: unless-stopped
    command: ["python", "-m", "Validation.Database.PANS.importer.pans_importer", "--config", "/opt/validation/docker/database.yaml"]
    volumes:
      - ./docker:/opt/validation/docker
      - ./runtime/reference:/opt/validation/runtime/reference
      - ${VALIDATION_OPERATOR_DATA_ROOT:-./runtime/reference}:/opt/validation/operator-data

  web:
    image: validation/parser:dev
    restart: unless-stopped
    command: ["python", "-m", "Validation.Web_Console.app.main", "--config", "/opt/validation/docker/console.yaml"]
    depends_on:
      - router
      - parser
      - forwarder
    volumes:
      - ./docker:/opt/validation/docker
      - ./runtime/data_inflow:/opt/validation/DATA_INFLOW
      - ./runtime/router-state:/opt/validation/Validation/Data_Router/state
      - ./runtime/router-logs:/opt/validation/Validation/Data_Router/logs
      - ./runtime/spool:/opt/validation/Validation/Data_Forwarder/spool
      - ./runtime/reference:/opt/validation/runtime/reference
      - ${VALIDATION_OPERATOR_DATA_ROOT:-./runtime/reference}:/opt/validation/operator-data
    environment:
      VALIDATION_DATABASE_CONFIG: /opt/validation/docker/database.yaml
      VALIDATION_DATABASE_BROWSE_ROOT: /opt/validation/operator-data
    ports:
      - "8088:8088"
