name: Validation CI

on:
  push:
    branches:
      - dev/validation-full-build
  pull_request:

jobs:
  full-validation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Validation/Data_Parser/requirements.txt
          python -m pip install -r Validation/Data_Router/requirements.txt
          python -m pip install -r Validation/Data_Forwarder/requirements.txt
          python -m pip install -r Validation/Web_Console/requirements.txt
          python -m pip install -r Validation/Database/requirements.txt

      - name: Run complete Validation gate
        run: |
          chmod +x scripts/run_validation_gate.sh
          ./scripts/run_validation_gate.sh
