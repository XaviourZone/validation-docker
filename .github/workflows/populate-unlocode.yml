name: Populate UN LOCODE data

on:
  push:
    branches:
      - dev/validation-full-build

permissions:
  contents: write

jobs:
  populate-unlocode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download UN/LOCODE 2025-1 source
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/metanorma/unlocodes/2b25d34ccc1a749a03b864f7926482bea02044f2/lib/unlocodes/data/locode.jsonld" \
            -o /tmp/locode.jsonld

      - name: Build offline code-to-name mapping
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          src = Path("/tmp/locode.jsonld")
          out = Path("Validation/Data_Parser/config/unlocode.json")

          data = json.loads(src.read_text(encoding="utf-8"))
          graph = data.get("@graph", [])

          mapping = {}
          for item in graph:
              code = item.get("rdf:value") or item.get("@id", "").split(":")[-1]
              label = item.get("rdfs:label")

              if isinstance(label, dict):
                  name = label.get("@value")
              elif isinstance(label, list):
                  name = next((x.get("@value") for x in label if isinstance(x, dict) and x.get("@value")), None)
              else:
                  name = label

              if isinstance(code, str) and isinstance(name, str):
                  code = code.strip().upper()
                  name = name.strip()
                  if code and name:
                      mapping[code] = name

          if len(mapping) < 100000:
              raise SystemExit(f"Unexpected UN/LOCODE count: {len(mapping)}")

          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(
              json.dumps(mapping, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(f"Wrote {len(mapping)} UN/LOCODE entries to {out}")
          print(f"Size: {out.stat().st_size} bytes")
          PY

      - name: Commit populated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Validation/Data_Parser/config/unlocode.json
          if git diff --cached --quiet; then
            echo "UN/LOCODE mapping already current"
          else
            git commit -m "Populate offline UN/LOCODE 2025-1 dataset"
            git push
          fi
