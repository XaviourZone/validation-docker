data_inflow:
  base_dir: DATA_INFLOW
parser_destinations:
  SAIS:
    host: parser
    port: 10001
    framing: ndjson
    timeout_seconds: 30.0
    keep_alive: true
  MSIS:
    host: parser
    port: 10002
    framing: ndjson
    timeout_seconds: 30.0
    keep_alive: true
  LRIT:
    host: parser
    port: 10003
    framing: ndjson
    timeout_seconds: 30.0
    keep_alive: true
  VATMS:
    host: parser
    port: 10004
    framing: ndjson
    timeout_seconds: 30.0
    keep_alive: true
  NAIS:
    host: parser
    port: 10005
    framing: ndjson
    timeout_seconds: 30.0
    keep_alive: true

sources:
  SAIS_IOR:
    type: file
    folder: SAIS_IOR
    parser: SAIS
    enabled: true
    poll_interval_seconds: 1.0
    stability_window_seconds: 1.0
    file_patterns: ["*.csv", "*.txt", "*"]
    preserve_file: false
    processed_folder: ""
  SAIS_GLOBAL:
    type: file
    folder: SAIS_GLOBAL
    parser: SAIS
    enabled: true
    poll_interval_seconds: 1.0
    stability_window_seconds: 1.0
    file_patterns: ["*.csv", "*.txt", "*"]
    preserve_file: false
    processed_folder: ""
  MSIS:
    type: file
    folder: MSIS
    parser: MSIS
    enabled: true
    poll_interval_seconds: 1.0
    stability_window_seconds: 1.0
    file_patterns: ["*.csv", "*.txt", "*"]
    preserve_file: false
    processed_folder: ""
  LRIT:
    type: file
    folder: LRIT
    parser: LRIT
    enabled: true
    poll_interval_seconds: 1.0
    stability_window_seconds: 1.0
    file_patterns: ["*.csv", "*.txt", "*"]
    preserve_file: false
    processed_folder: ""
  VATMS_EAST:
    type: tcp
    remote_host: host.docker.internal
    remote_port: 20001
    parser: VATMS
    enabled: false
    framing: line
    delimiter: "\n"
    max_line_length: 65536
    reconnect_initial_delay: 2.0
    reconnect_max_delay: 60.0
    reconnect_multiplier: 2.0
  VATMS_WEST:
    type: tcp
    remote_host: host.docker.internal
    remote_port: 20002
    parser: VATMS
    enabled: false
    framing: line
    delimiter: "\n"
    max_line_length: 65536
    reconnect_initial_delay: 2.0
    reconnect_max_delay: 60.0
    reconnect_multiplier: 2.0
  NAIS:
    type: tcp
    remote_host: host.docker.internal
    remote_port: 20003
    parser: NAIS
    enabled: false
    framing: line
    delimiter: "\n"
    max_line_length: 65536
    reconnect_initial_delay: 2.0
    reconnect_max_delay: 60.0
    reconnect_multiplier: 2.0

retry:
  max_attempts: 5
  initial_delay_seconds: 2.0
  max_delay_seconds: 60.0
  backoff_multiplier: 2.0
queue:
  max_size: 10000
  worker_count: 4
  high_watermark_ratio: 0.8
monitoring:
  enabled: true
  http_host: 0.0.0.0
  http_port: 8080
state:
  db_path: state/router_state.db
